name: Feature request
description: Suggest something Depot should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that Depot makes hard or impossible today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: The behaviour you want. Sketches and screenshots welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Other ways to solve it, including how other file managers handle it.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I checked the roadmap in the README and this is not already planned
        - label: I would be willing to work on this
