name: package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            platform: macos-latest
            rust_targets: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
            artifact: depot-macos-aarch64
            path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

          - name: macOS (Intel)
            platform: macos-latest
            rust_targets: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg
            artifact: depot-macos-x86_64
            path: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg

          - name: Linux (deb)
            platform: ubuntu-22.04
            rust_targets: ""
            args: --bundles deb
            artifact: depot-linux-amd64
            path: src-tauri/target/release/bundle/deb/*.deb

          - name: Windows (exe)
            platform: windows-latest
            rust_targets: ""
            args: --bundles nsis
            artifact: depot-windows-x64
            path: src-tauri/target/release/bundle/nsis/*-setup.exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.artifact }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev

      - name: Install npm dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          includeRelease: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tagName: ${{ github.ref_name }}
          releaseName: Depot ${{ github.ref_name }}
          releaseBody: Installers for this version are attached below.
          releaseDraft: false
          prerelease: false

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
