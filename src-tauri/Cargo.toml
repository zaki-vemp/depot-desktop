[package]
name = "depot"
version = "0.1.0"
description = "Cross-platform file explorer with cloud drives, media tabs, and legal torrent downloads"
authors = ["Syed Zakiuddin"]
license = "MIT"
repository = "https://github.com/zaki-vemp/depot-desktop"
edition = "2021"

[lib]
name = "depot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` unlocks multi-webview, which web tabs need: an iframe cannot render
# sites that send X-Frame-Options, a child webview can.
tauri = { version = "2", features = ["protocol-asset", "unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
walkdir = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "net", "io-util", "fs", "time", "sync", "process"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"
urlencoding = "2"
chrono = { version = "0.4", features = ["serde"] }
librqbit = "8.1.1"
futures-util = "0.3"
thiserror = "2"
trash = "5"
sysinfo = { version = "0.33", default-features = false, features = ["disk"] }
calamine = "0.26"
zip = { version = "2", default-features = false, features = ["deflate"] }
libloading = "0.8"
# A real pty, not piped stdio: the built-in terminal has to run interactive
# shells, curses programs and colour output the same way a native one does.
portable-pty = "0.9"
# Native folder picker for choosing a code-workspace root.
tauri-plugin-dialog = "2"

# Dragging files out of the window. GTK is handled in `dragout.rs` instead,
# because this crate emits unescaped `file://` URIs, which drops every name
# containing a space.
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
drag = "2.1"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
# `CF_HDROP` on the clipboard: the only way Explorer accepts a file list.
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_UI_Shell",
] }

# File URLs on `NSPasteboard`, which is what Finder pastes.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "0.3", features = [
  "std",
  "NSArray",
  "NSString",
  "NSURL",
] }

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
gtk = { version = "0.18", features = ["v3_24"] }
glib = "0.18"
webkit2gtk = { version = "2", features = ["v2_40"] }

# Leaner dev builds on every platform (Windows/macOS/Linux):
# keeps line numbers in panic backtraces, but emits far less DWARF/PDB
# debug info. This roughly halves the size of target/debug and prevents
# linker failures (e.g. `ld terminated with signal 7 [Bus error]` on
# SIGBUS when the disk is nearly full) on machines with little free space.
[profile.dev]
debug = "line-tables-only"

# Same idea for the bundled release build: full backtraces, smaller artifacts.
[profile.release]
debug = "line-tables-only"
strip = "debuginfo"
